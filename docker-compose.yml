services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: trophy
      POSTGRES_PASSWORD: trophy_local_only
      POSTGRES_DB: trophy
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["trophy_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trophy -d trophy"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  medusa:
    image: node:24-bookworm-slim
    working_dir: /server
    command: npm run dev
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:5173:5173"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://trophy:trophy_local_only@postgres:5432/trophy
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9002
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/server
  storage:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    env_file: ./backend/.env
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes: ["trophy_objects:/data"]
volumes:
  trophy_postgres:
  trophy_objects:
